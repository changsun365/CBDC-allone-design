<title>AllOne BANK 디자인 시안</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  #index-page {
    width: 100%; height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    overflow-y: auto;
    position: relative;
    background: #fff;
  }
  #index-page img {
    width: 100%;
    display: block;
  }
  .tap-zone-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
  }
  .tap-zone {
    position: absolute;
    left: 5%; width: 90%;
    cursor: pointer;
  }

  #viewer {
    display: none;
    width: 100%; height: 100vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: #fff;
  }
  #viewer.active { display: block; }

  .screen { display: none; }
  .screen.visible { display: block; }
  .screen img {
    width: 100%;
    display: block;
    cursor: pointer;
  }

  .progress {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    display: none; gap: 6px; z-index: 100;
    align-items: center;
  }
  .progress.active { display: flex; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(0,0,0,0.18);
    transition: all 0.2s;
  }
  .dot.current { background: #333; width: 18px; border-radius: 3px; }
</style>

<div class="progress" id="progress">
  <div class="dot current" id="d0"></div>
  <div class="dot" id="d1"></div>
  <div class="dot" id="d2"></div>
  <div class="dot" id="d3"></div>
</div>

<script>
let current = 0;
const total = 4;

const img = document.getElementById('indexImg');
const wrap = document.getElementById('tapZones');

function placeZones() {
  const ih = img.getBoundingClientRect().height;

  let zA = document.getElementById('zone-a');
  if (!zA) { zA = document.createElement('div'); zA.id = 'zone-a'; zA.className = 'tap-zone'; wrap.appendChild(zA); }
  zA.style.top = (ih * 0.335) + 'px';
  zA.style.height = (ih * 0.085) + 'px';
  zA.onclick = () => startViewer('A');

  let zB = document.getElementById('zone-b');
  if (!zB) { zB = document.createElement('div'); zB.id = 'zone-b'; zB.className = 'tap-zone'; wrap.appendChild(zB); }
  zB.style.top = (ih * 0.425) + 'px';
  zB.style.height = (ih * 0.085) + 'px';
  zB.onclick = () => startViewer('B');
}

if (img.complete) placeZones();
else img.onload = placeZones;
window.addEventListener('resize', placeZones);

function startViewer(type) {
  if (type === 'B') { alert('시안 B는 준비 중입니다.'); return; }
  document.getElementById('index-page').style.visibility = 'hidden';
  document.getElementById('index-page').style.position = 'fixed';
  document.getElementById('viewer').classList.add('active');
  document.getElementById('progress').classList.add('active');
  current = 0;
  showScreen(0);
}

function showScreen(idx) {
  for (let i = 0; i < total; i++) {
    document.getElementById('s' + i).classList.remove('visible');
    document.getElementById('d' + i).classList.remove('current');
  }
  document.getElementById('s' + idx).classList.add('visible');
  document.getElementById('d' + idx).classList.add('current');
  document.getElementById('viewer').scrollTop = 0;
}

function nextScreen() {
  if (current < total - 1) {
    current++;
    showScreen(current);
  } else {
    document.getElementById('viewer').classList.remove('active');
    document.getElementById('progress').classList.remove('active');
    const indexPage = document.getElementById('index-page');
    indexPage.style.visibility = 'visible';
    indexPage.style.position = 'relative';
    current = 0;
    placeZones();
  }
}
</script>
